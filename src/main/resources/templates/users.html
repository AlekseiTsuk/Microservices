<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin panel</title>
</head>
<body>
<div>
    <table>
        <thead>
        <tr>
            <th>Id</th>
            <th>Username</th>
            <th>Age</th>
            <th>RoomNumber</th>
            <th>Password</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user:${users}">
            <td th:text="${user.id}"></td>
            <td th:text="${user.username}"></td>
            <td th:text="${user.age}"></td>
            <td th:text="${user.roomNumber}"></td>
            <td th:text="${user.password}"></td>
            <td>
                <span th:each="role:${user.roles}" th:text="${role.role}+' '"></span>
            </td>
            <td>
                <a th:href="@{/edit/{id}(id=${user.id})}">Edit</a>
                <form th:action ="@{/delete/{id}(id=${user.id})}"
                method="post"
                style="display:inline">
                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <div>
        <a th:href="@{admin/create}">Add new user</a>
    </div>
</div>
<form th:action="@{/logout}" metod="post">
    <button type="submit">LogOut</button>
</form>
</body>
</html>
