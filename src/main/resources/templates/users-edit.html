<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">>

    <head>
        <meta charset="UTF-8">
        <title>Edit</title>
    </head>
<body>
<h2>User Edit</h2>
<form th:action="@{/edit/{id}(id=${user.id})}"
      th:object="${user}"
      method="post">
    <input type="hidden" th:field="*{id}" />
    <div>
        <label for="name">Name: </label>
        <input type="text"
               id="name"
               th:field="*{name}"
               required/>
    </div>
    <div>
        <label for="age">Age: </label>
        <input type="text"
               id="age"
               th:field="*{age}"
               required/>
    </div>
    <div>
        <label for="room">Room: </label>
        <input type="text"
               id="room"
               th:field="*{roomNumber}"
               required/>
    </div>
    <div>
        <button type="submit">Update</button>
    </div>
</form>
<p>
    <a th:href="@{/}">Back to list</a>
</p>
</body>
</html>
